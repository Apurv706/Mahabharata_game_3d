<script>
/* Every modelled figure and beast (js/g3/models: tens of megabytes) is fetched before the game opens: a slow start,
   chosen over fights that begin with the plainer code-built figures. The bar counts the files in. A file that will not
   come is tried three times and then let go, and its people are drawn by code (js/g3/model.js). If the wait is long
   a button offers to begin at once; the files go on arriving behind the game. No WebGL: nothing is fetched. */
(function () {
  var list = window.K_MODELS || [], box = document.getElementById("preload"), bar = document.getElementById("pl-bar"), pct = document.getElementById("pl-pct"), skip = document.getElementById("pl-skip"), n = 0, over = false;
  function keys(e) { if (e.target !== skip) e.stopPropagation(); }                    // nothing behind the curtain hears a key
  function app() { return document.querySelector(".app"); }
  function finish() {
    if (over) return; over = true; window.removeEventListener("keydown", keys, true); var a = app(); if (a) a.inert = false;
    box.classList.add("done"); setTimeout(function () { box.remove(); }, 600); window.K_MODELS_READY = true; document.dispatchEvent(new Event("k-models"));
  }
  function tick() { n++; var p = Math.min(100, Math.round(n / list.length * 100)); bar.style.width = p + "%"; pct.textContent = p + "%"; if (n >= list.length) finish(); }
  function get(src, tries) {
    var s = document.createElement("script"); s.src = src; s.async = true; s.onload = tick;
    s.onerror = function () { s.remove(); if (tries < 3) setTimeout(function () { get(src, tries + 1); }, 900 * tries); else tick(); };
    document.head.appendChild(s);
  }
  var gl = false; try { var c = document.createElement("canvas"); gl = !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) {}
  if (!gl || !list.length) { finish(); return; }
  window.addEventListener("keydown", keys, true);
  document.addEventListener("DOMContentLoaded", function () { var a = app(); if (a && !over) a.inert = true; });
  for (var i = 0; i < list.length; i++) get(list[i], 1);
  setTimeout(function () { if (!over) skip.hidden = false; }, 25000);
  skip.addEventListener("click", finish);
})();
</script>
